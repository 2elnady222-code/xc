name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apple-tool-pro-mobile/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: apple-tool-pro-mobile
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        working-directory: apple-tool-pro-mobile
        run: pnpm exec expo prebuild --platform android --non-interactive

      - name: Build debug APK
        working-directory: apple-tool-pro-mobile/android
        run: ./gradlew assembleDebug -PbundleInDebug=true --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Tool-Pro-Android-APK
          path: apple-tool-pro-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
